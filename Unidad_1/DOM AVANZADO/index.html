<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USO DE DOM - AVANZADO -</title>
    <link rel="icon" type="image/png" href="./assets/rocket.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis&family=Open+Sans&family=Parisienne&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="formContainer">
        <div class="title"><img src="./assets/rocket.svg" alt="logo" /></div>
        <form id="taskForm" data-form>
          <input type="text" name="task" placeholder="Nombre de la tarea" class="inputForm" autocomplete="off" data-input-task required />
          <input type="text" name="description" placeholder="Descripción" class="inputForm" autocomplete="off" data-input-descripcion required />
          <input type="date" name="date" class="inputForm" data-input-fecha required />
          <input type="text" name="priority" placeholder="Prioridad" class="inputForm" autocomplete="off" data-input-prioridad required />

          <input type="text" name="category" placeholder="Categoría" class="inputForm" autocomplete="off" data-input-categoria required />
          <input type="text" name="responsable" placeholder="Responsable" class="inputForm" autocomplete="off" data-input-responsable required />
          <input type="text" name="location" placeholder="Lugar" class="inputForm" autocomplete="off" data-input-lugar required />

          <button type="submit" class="btnCreate">
            Agregar <i class="fas fa-plus-circle"></i>
          </button>
        </form>
      </div>

      <div class="contentContainer">
        <div class="tableContainer">
          <h2>Lista de Tareas</h2>
          <table id="taskTable">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Fecha</th>
                <th>Prioridad</th>
                <th>Categoría</th>
                <th>Responsable</th>
                <th>Lugar</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="cardsContainer">
          <h2>Tareas Registradas</h2>
          <div id="taskCards"></div>
        </div>
      </div>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
